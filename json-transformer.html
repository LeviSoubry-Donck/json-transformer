<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice JSON Transformer</title>

  <style>
    :root {
      --bg: #171717;
      --panel: #222222;
      --panel-alt: #2b2b2b;
      --editor: #1e1e1e;
      --border: #444;
      --orange: #ff6d3a;
      --orange-hover: #ff8157;
      --text: #f3f3f3;
      --muted: #a9a9a9;
      --success: #64d98b;
      --error: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #292929 0, transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .app {
      max-width: 1500px;
      margin: 0 auto;
      padding: 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .title-wrap p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      border: 1px solid var(--orange);
      color: var(--orange);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(255, 109, 58, 0.08);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 1px solid #555;
      background: #2b2b2b;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: var(--orange);
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--orange);
      color: #171717;
      border-color: var(--orange);
    }

    button.primary:hover {
      background: var(--orange-hover);
    }

    .status {
      min-height: 24px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    #success {
      color: var(--success);
    }

    #error {
      color: var(--error);
      white-space: pre-wrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: var(--panel-alt);
      border-bottom: 1px solid #3f3f3f;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #ddd;
    }

    .panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 10px rgba(255, 109, 58, 0.75);
    }

    .panel-note {
      font-size: 12px;
      color: var(--muted);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 610px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: var(--editor);
      color: #e5e5e5;
      padding: 18px;
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;
      font-size: 13px;
      line-height: 1.6;
      caret-color: var(--orange);
    }

    textarea:focus {
      box-shadow: inset 0 0 0 1px var(--orange);
    }

    textarea::placeholder {
      color: #666;
    }

    #codePanel {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--orange);
    }

    #transformCode {
      min-height: 520px;
      background: #1b1b1b;
      color: #f1f1f1;
    }

    .code-accent {
      color: var(--orange);
    }

    .footer {
      margin-top: 18px;
      color: #777;
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 950px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 20px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title-wrap">
      <h1>Invoice JSON Transformer</h1>
      <p>Paste invoice JSON, transform it using your n8n mapping, and copy the output.</p>
    </div>

    <div class="badge">n8n style</div>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="transformJson()">
      Transform JSON
    </button>

    <button onclick="copyOutput()">
      Copy Output
    </button>

    <button id="codeButton" onclick="toggleCode()">
      Show Transform Code
    </button>

    <button onclick="clearAll()">
      Clear
    </button>
  </div>

  <div class="status">
    <div id="success"></div>
    <div id="error"></div>
  </div>

  <div class="workspace">

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-dot"></span>
          Input JSON
        </div>
        <div class="panel-note">Source</div>
      </div>

      <textarea
        id="input"
        spellcheck="false"
        placeholder='Paste your invoice JSON here...'
      ></textarea>
    </div>


    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-dot"></span>
          Output JSON
        </div>
        <div class="panel-note">Transformed</div>
      </div>

      <textarea
        id="output"
        spellcheck="false"
        readonly
        placeholder="Transformed output will appear here..."
      ></textarea>
    </div>

  </div>


  <div id="codePanel" class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <span class="panel-dot"></span>
        Transform Code Used
      </div>

      <div class="panel-note">
        n8n JavaScript
      </div>
    </div>

    <textarea
      id="transformCode"
      spellcheck="false"
      readonly
    ></textarea>
  </div>

  <div class="footer">
    Invoice transformation utility
  </div>

</div>


<script>

const transformCodeText = `return items.map(item => {
  const root = item.json ?? item;
  const data = root.data ?? root;
  const lines = root.Line ?? [];

  return {
    json: {
      documentType: 'Invoice',
      documentNo: data.InvoiceNumber?.toString() ?? '',
      VendordocumentNo: data.InvoiceNumber?.toString() ?? '',
      vendorNo: data.vendorNumber ?? '',
      yourReference: data.Reference ?? '',
      documentDate: data.InvoiceDate ? new Date(data.InvoiceDate).toISOString().split('T')[0] : '',
      journalTemplateName: 'AKF',
      postingDate: data.InvoiceDate ? new Date(data.InvoiceDate).toISOString().split('T')[0] : '',
      
      importPurchaseDocumentLines: lines.flatMap((lineWrapper, index) => {

        const line = lineWrapper["data.InvoiceLine"] ?? {};
        const vatProd = lineWrapper.btwProductboekingsgroep ?? '';
        const vatBus = lineWrapper.btwBedrijfsboekingsgroep ?? '';
        const genProd = lineWrapper.Grootboekrekening ?? '';
        const baseLineNo = (line.LineNo ?? (index + 1)) * 1000;
        const price = line.Price ?? 0;
        const hasIntrastat = !!line.Intrastat;

        
        const mainLine = {
          documentNo: data.InvoiceNumber?.toString() ?? '',
          lineNo: baseLineNo,
          type: 'G/L Account',
          no: genProd,
          directUnitCost: Number(Math.abs(price / line.Quantity).toFixed(5)),
          quantity: line.Quantity,
          vatProdPostingGroup: vatProd,
          vatBusPostingGroup: vatBus,
          genProdPostingGroup: genProd,
          genBusPostingGroup: 'Normaal',
          tariffNo: line.Intrastat,
          
            // hasIntrastat
            // ? line.Intrastat
            // : line.Correction
            //  ? '99999999'
            //  : '',
          
            // netWeight: line.Weight
          netWeight: Number((line.Weight / line.Quantity).toFixed(5))
          
            // hasIntrastat
            // ? Number((line.Weight / line.Quantity).toFixed(5))
            // : (line.Correction ? 0.1 : 0)
          
        };
        return [mainLine];
      }),
    }
  };
});`;

document.getElementById("transformCode").value = transformCodeText;


function runTransform(items) {

  return items.map(item => {

    const root = item.json ?? item;
    const data = root.data ?? root;
    const lines = root.Line ?? [];

    return {
      json: {
        documentType: 'Invoice',

        documentNo:
          data.InvoiceNumber?.toString() ?? '',

        VendordocumentNo:
          data.InvoiceNumber?.toString() ?? '',

        vendorNo:
          data.vendorNumber ?? '',

        yourReference:
          data.Reference ?? '',

        documentDate:
          data.InvoiceDate
            ? new Date(data.InvoiceDate)
                .toISOString()
                .split('T')[0]
            : '',

        journalTemplateName:
          'AKF',

        postingDate:
          data.InvoiceDate
            ? new Date(data.InvoiceDate)
                .toISOString()
                .split('T')[0]
            : '',


        importPurchaseDocumentLines:
          lines.flatMap((lineWrapper, index) => {

            const line =
              lineWrapper["data.InvoiceLine"] ?? {};

            const vatProd =
              lineWrapper.btwProductboekingsgroep ?? '';

            const vatBus =
              lineWrapper.btwBedrijfsboekingsgroep ?? '';

            const genProd =
              lineWrapper.Grootboekrekening ?? '';

            const baseLineNo =
              (line.LineNo ?? (index + 1)) * 1000;

            const price =
              line.Price ?? 0;

            const hasIntrastat =
              !!line.Intrastat;


            const mainLine = {

              documentNo:
                data.InvoiceNumber?.toString() ?? '',

              lineNo:
                baseLineNo,

              type:
                'G/L Account',

              no:
                genProd,

              directUnitCost:
                Number(
                  Math.abs(
                    price / line.Quantity
                  ).toFixed(5)
                ),

              quantity:
                line.Quantity,

              vatProdPostingGroup:
                vatProd,

              vatBusPostingGroup:
                vatBus,

              genProdPostingGroup:
                genProd,

              genBusPostingGroup:
                'Normaal',

              tariffNo:
                line.Intrastat,

              netWeight:
                Number(
                  (
                    line.Weight /
                    line.Quantity
                  ).toFixed(5)
                )
            };

            return [mainLine];

          }),
      }
    };

  });

}


function transformJson() {

  const input =
    document.getElementById("input").value;

  const output =
    document.getElementById("output");

  const success =
    document.getElementById("success");

  const error =
    document.getElementById("error");


  success.textContent = "";
  error.textContent = "";
  output.value = "";


  try {

    const parsed =
      JSON.parse(input);

    let items;


    if (Array.isArray(parsed)) {

      items = parsed;

    }

    else if (
      parsed &&
      Array.isArray(parsed.items)
    ) {

      items = parsed.items;

    }

    else {

      items = [parsed];

    }


    const result =
      runTransform(items);


    output.value =
      JSON.stringify(
        result,
        null,
        2
      );


    success.textContent =
      "✓ Transformation completed successfully";

  }

  catch (err) {

    error.textContent =
      "✕ JSON error: " + err.message;

  }

}


async function copyOutput() {

  const output =
    document.getElementById("output").value;

  const success =
    document.getElementById("success");


  if (!output) {

    success.textContent = "";
    document.getElementById("error").textContent =
      "Nothing to copy.";

    return;

  }


  try {

    await navigator.clipboard.writeText(output);

    success.textContent =
      "✓ Output copied to clipboard";

  }

  catch {

    const element =
      document.getElementById("output");

    element.select();

    document.execCommand("copy");

    success.textContent =
      "✓ Output copied to clipboard";

  }

}


function toggleCode() {

  const panel =
    document.getElementById("codePanel");

  const button =
    document.getElementById("codeButton");


  if (
    panel.style.display === "none" ||
    panel.style.display === ""
  ) {

    panel.style.display = "block";
    button.textContent = "Hide Transform Code";

    panel.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

  else {

    panel.style.display = "none";
    button.textContent = "Show Transform Code";

  }

}


function clearAll() {

  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
  document.getElementById("success").textContent = "";
  document.getElementById("error").textContent = "";

}

</script>

</body>
</html>
